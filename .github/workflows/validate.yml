name: Validate packs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate all packs
        run: |
          shopt -s nullglob
          packs=(packs/*/)
          if [ ${#packs[@]} -eq 0 ]; then echo "no packs"; exit 1; fi
          python tools/validate_pack.py "${packs[@]}"
